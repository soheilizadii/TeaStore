---
# Source: teastore/templates/teastore-recommender-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-recommender
  labels:
    app: teastore
    run: teastore-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-recommender
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-recommender
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: wait-for-teastore-auth
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for teastore-auth to be ready..."
              until nc -z teastore-auth 8080; do
                echo "Still waiting for teastore-auth on port 8080..."
                sleep 3
              done
              echo "teastore-auth is ready!"
      containers:
        - name: teastore-recommender
          image: "kieker/teastore-recommender:kieker-2.0.2"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST_NAME
              value: "teastore-recommender"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: RABBITMQ_HOST
              value: "teastore-rabbitmq"
          volumeMounts:
            - name: kieker-config
              mountPath: /kieker/config/kieker.monitoring.properties
              subPath: kieker.monitoring.properties
          # readinessProbe:
          #   httpGet:
          #     path: "/tools.descartes.teastore.recommender/rest/train/isready"
          #     port: 8080
          #     scheme: HTTP
          #   initialDelaySeconds: 15
          #   timeoutSeconds: 5
          #   periodSeconds: 10
          #   successThreshold: 1
          #   failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: kieker-config
          configMap:
            name: kieker-config
