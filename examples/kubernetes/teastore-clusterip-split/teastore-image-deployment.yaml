---
# Source: teastore/templates/teastore-image-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-image
  labels:
    app: teastore
    run: teastore-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-image
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-image
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: wait-for-teastore-recommender
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for teastore-recommender to be ready..."
              until nc -z teastore-recommender 8080; do
                echo "Still waiting for teastore-recommender..."
                sleep 3
              done
              echo "teastore-recommender is ready!"

      containers:
        - name: teastore-image
          image: "kieker/teastore-image:kieker-2.0.2"
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: "teastore-image"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: RABBITMQ_HOST
              value: "teastore-rabbitmq"
          volumeMounts:
            - name: kieker-config-volume
              mountPath: /kieker/config/kieker.monitoring.properties
              subPath: kieker.monitoring.properties
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kieker-config-volume
          configMap:
            name: kieker-config
