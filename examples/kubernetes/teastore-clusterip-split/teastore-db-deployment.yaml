---
# Source: teastore/templates/teastore-db-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-db
  labels:
    app: teastore
    run: teastore-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-db
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-db
    spec:
      initContainers:
        - name: wait-for-otel-transformer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "🕓 Waiting for otel-transformer to be ready on port 10001..."
              until nc -z otel-transformer 10001; do
                echo "otel-transformer not ready yet... sleeping 5s"
                sleep 5
              done
              echo "✅ otel-transformer is ready!"
      containers:
        - name: teastore-db
          image: "kieker/teastore-db:kieker-2.0.2"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 1000Mi
            limits:
              cpu: 2000m
              memory: 2000Mi
