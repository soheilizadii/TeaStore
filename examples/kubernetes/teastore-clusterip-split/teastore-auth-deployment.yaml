---
# Source: teastore/templates/teastore-auth-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-auth
  labels:
    app: teastore
    run: teastore-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-auth
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-auth
    spec:
      terminationGracePeriodSeconds: 0

      initContainers:
        - name: wait-for-teastore-persistence
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for teastore-persistence to be ready..."
              until nc -z teastore-persistence 8080; do
                echo "Still waiting for teastore-persistence on port 8080..."
                sleep 3
              done
              echo "teastore-persistence is ready!"

      containers:
        - name: teastore-auth
          image: "kieker/teastore-auth:kieker-2.0.2"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST_NAME
              value: "teastore-auth"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: RABBITMQ_HOST
              value: "teastore-rabbitmq"

          # ✅ Mount shared Kieker ConfigMap
          volumeMounts:
            - name: kieker-config-volume
              mountPath: /kieker/config/kieker.monitoring.properties
              subPath: kieker.monitoring.properties

          readinessProbe:
            httpGet:
              path: "/tools.descartes.teastore.auth/rest/ready/isready"
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # ✅ Declare volume for Kieker ConfigMap
      volumes:
        - name: kieker-config-volume
          configMap:
            name: kieker-config
