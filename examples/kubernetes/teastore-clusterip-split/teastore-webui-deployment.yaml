---
# Source: teastore/templates/teastore-webui-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-webui
  labels:
    app: teastore
    run: teastore-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-webui
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-webui
    spec:
      terminationGracePeriodSeconds: 0

      initContainers:
        - name: wait-for-teastore-image
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for teastore-image service to be ready..."
              until nc -z teastore-image 8080; do
                echo "Still waiting for teastore-image..."
                sleep 3
              done
              echo "teastore-image is ready!"

      containers:
        - name: teastore-webui
          image: "kieker/teastore-webui:kieker-2.0.2"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: HOST_NAME
              value: "teastore-webui"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: RABBITMQ_HOST
              value: "teastore-rabbitmq"

          # ✅ Mount shared Kieker ConfigMap
          volumeMounts:
            - name: kieker-config-volume
              mountPath: /kieker/config/kieker.monitoring.properties
              subPath: kieker.monitoring.properties

          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 700m
              memory: 1024Mi

      # ✅ Declare volume for Kieker ConfigMap
      volumes:
        - name: kieker-config-volume
          configMap:
            name: kieker-config
