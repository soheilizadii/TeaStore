---
# Source: teastore/templates/teastore-persistence-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  labels:
    app: teastore
    run: teastore-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      run: teastore-persistence
  template:
    metadata:
      labels:
        app: teastore
        run: teastore-persistence
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: wait-for-teastore-registry
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for teastore-registry to be ready..."
              until nc -z teastore-registry 8080; do
                echo "Still waiting for teastore-registry on port 8080..."
                sleep 3
              done
              echo "teastore-registry is ready!"
      containers:
        - name: teastore-persistence
          image: "kieker/teastore-persistence:kieker-2.0.2"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST_NAME
              value: "teastore-persistence"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: DB_HOST
              value: "teastore-db"
            - name: DB_PORT
              value: "3306"
            - name: RABBITMQ_HOST
              value: "teastore-rabbitmq"
          volumeMounts:
            - name: kieker-config
              mountPath: /kieker/config/kieker.monitoring.properties
              subPath: kieker.monitoring.properties
          # readinessProbe:
          #   httpGet:
          #     path: /tools.descartes.teastore.persistence/rest/ready/isready
          #     port: 8080
          #     scheme: HTTP
          # livenessProbe:
          #   httpGet:
          #     path: /tools.descartes.teastore.persistence/rest/ready/isready
          #     port: 8080
          #     scheme: HTTP
      volumes:
        - name: kieker-config
          configMap:
            name: kieker-config
